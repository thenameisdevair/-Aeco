<style>
  html, body { background: #0a0a0f; color: #e5e7eb; }
  body { font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }

  /* Subtle dotted background */
  .bg-grid {
    background-image:
      radial-gradient(circle at 1px 1px, rgba(255,255,255,0.04) 1px, transparent 0);
    background-size: 28px 28px;
  }

  /* Animated gradient underline */
  @keyframes shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }
  .gradient-underline {
    background: linear-gradient(90deg,
      transparent 0%,
      rgba(245,200,66,0.6) 25%,
      rgba(245,200,66,1) 50%,
      rgba(245,200,66,0.6) 75%,
      transparent 100%);
    background-size: 200% 100%;
    animation: shimmer 4s linear infinite;
  }

  /* Pulse dot */
  @keyframes breathe {
    0%, 100% { box-shadow: 0 0 0 0 rgba(34,197,94,0.55), 0 0 0 0 rgba(34,197,94,0.35); }
    50% { box-shadow: 0 0 0 6px rgba(34,197,94,0), 0 0 0 12px rgba(34,197,94,0); }
  }
  .breathe { animation: breathe 2.2s ease-out infinite; }

  /* Slow drift for ambient glow */
  @keyframes drift {
    0%, 100% { transform: translate3d(0,0,0); }
    50% { transform: translate3d(0,-20px,0); }
  }
  .drift { animation: drift 12s ease-in-out infinite; }

  /* Scrollbar styling */
  .scroll-thin::-webkit-scrollbar { width: 6px; }
  .scroll-thin::-webkit-scrollbar-track { background: transparent; }
  .scroll-thin::-webkit-scrollbar-thumb { background: #2b2b3a; border-radius: 3px; }
  .scroll-thin::-webkit-scrollbar-thumb:hover { background: #3b3b4a; }

  /* Card hover lift */
  .card-lift { transition: transform 240ms cubic-bezier(.2,.7,.3,1), box-shadow 240ms, border-color 240ms; }
  .card-lift:hover { transform: translateY(-2px); box-shadow: 0 24px 48px -24px rgba(0,0,0,0.7), 0 0 0 1px rgba(245,200,66,0.12); border-color: rgba(245,200,66,0.18); }

  /* Modal backdrop blur fix for Safari */
  .modal-backdrop { backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }

  /* No selection on icons */
  .no-select { user-select: none; -webkit-user-select: none; }

  /* Tabular numerics for scores */
  .tnum { font-variant-numeric: tabular-nums; }

  /* Ticker underline on hover */
  .link-underline { position: relative; }
  .link-underline::after {
    content:''; position:absolute; left:0; right:0; bottom:-3px;
    height:1px; background:currentColor; transform: scaleX(0); transform-origin:left;
    transition: transform .25s ease;
  }
  .link-underline:hover::after { transform: scaleX(1); }
</style>
