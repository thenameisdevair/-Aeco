name: Aeco Sentiment Agent

on:
  schedule:
    - cron: '0 */2 * * *'  # every 2 hours
  workflow_dispatch:         # manual trigger

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run agent cycle
        env:
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          PRIVATE_KEY_AGENT: ${{ secrets.PRIVATE_KEY_AGENT }}
          AGENT_WALLET: ${{ secrets.AGENT_WALLET }}
          RPC_URL: ${{ secrets.RPC_URL }}
          SENTIMENT_FEED_ADDRESS: ${{ secrets.SENTIMENT_FEED_ADDRESS }}
          HEARTBEAT_ORACLE_ADDRESS: ${{ secrets.HEARTBEAT_ORACLE_ADDRESS }}
          AGENT_VERSION: "1.0.0"
        run: npm run agent
